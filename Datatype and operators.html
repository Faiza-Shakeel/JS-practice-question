<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data type and operators</title>
</head>
<body>
 <script>
    // Calculate the sum, difference, product, and quotient of two numbers.
    let a = 5
    let b = 2
    console.log(a+b)
    console.log(a-b)
    console.log(a*b)
    console.log(a/b)
    // Convert a string "123" to a number and back to a string. Print both.
    let x = "hello"
    let y =Number(x)
    console.log(typeof(y))
    let z=String(y)
    console.log(typeof(z))
    // Check if a number is even or odd using the modulo operator.
    let number=prompt("enter a number")
    if (number%2 === 0){
        console.log("number is even ")
    }
    else
    console.log("number is odd")


 </script>
</body>
