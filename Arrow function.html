    <script>
        // Convert the greet function into an arrow function.
    const  greet =(name)=> {
    return ("hello " + name)
}
    let result= greet("faiza")
    console.log(result)
       // Write an arrow function square that returns the square of a number.
        
    const square =(number)=>{
     return number**2
}
    let sqr= square(5)
    console.log(sqr)
      // Write an arrow function that returns the first string longer than 5 characters from a list.
 const array = ["hello", "world", "javascript", "programming", "python"]
  const longstring = (arr) =>{
    for (let i=0; i<arr.length; i++){
    if (arr[i].length > 5){
         return arr[i]
    }
    else{
        return "no string found"
    }
}
 }
 let list = longstring(array)
 console.log(list)
